<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1190" height="1260" viewBox="238 145 1190 1260" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Smart Wallet — vector logo</title>
  <desc id="logo-description">Hand-built scalable vector recreation of the smart wallet mark: navy wallet, turquoise and blue cards, cyan circuit traces, and a blue clasp. Transparent background. All artwork uses editable paths, gradients and SVG filters; no embedded raster images or external assets.</desc>
